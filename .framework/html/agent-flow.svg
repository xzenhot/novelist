<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6ea8fe"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b93a7"/>
    </marker>
    <linearGradient id="phaseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e2230"/>
      <stop offset="1" stop-color="#171a23"/>
    </linearGradient>
  </defs>

  <style>
    .title { fill: #ffffff; font-size: 26px; font-weight: 700; }
    .subtitle { fill: #8b93a7; font-size: 14px; }
    .phase-label { fill: #c792ea; font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
    .phase-num { fill: #6ea8fe; font-size: 12px; font-weight: 700; }
    .box { fill: #1e2230; stroke: #2a2f3f; stroke-width: 1.5; rx: 8; }
    .box-title { fill: #ffffff; font-size: 14px; font-weight: 600; }
    .box-sub { fill: #8b93a7; font-size: 11px; }
    .box-agent { fill: #6ea8fe; font-size: 11px; }
    .box-skill { fill: #7fd1a8; font-size: 11px; }
    .box-output { fill: #e5c07b; font-size: 11px; }
    .arrow { stroke: #6ea8fe; stroke-width: 2; fill: none; }
    .arrow-muted { stroke: #8b93a7; stroke-width: 1.5; fill: none; }
    .phase-band { fill: url(#phaseGrad); stroke: #2a2f3f; stroke-width: 1; rx: 12; }
    .filter-box { fill: #171a23; stroke: #2a2f3f; stroke-width: 1.5; rx: 6; }
    .filter-name { fill: #ffffff; font-size: 12px; font-weight: 600; }
    .filter-num { fill: #6ea8fe; font-size: 10px; font-weight: 700; }
    .legend-text { fill: #8b93a7; font-size: 12px; }
  </style>

  <!-- Title -->
  <text x="480" y="40" text-anchor="middle" class="title">Writer Agent — Flow of Agents</text>
  <text x="480" y="62" text-anchor="middle" class="subtitle">Backlog → Scaffold → Filters → Write → Promote</text>

  <!-- ===================== PHASE 0: BACKLOG ===================== -->
  <rect x="40" y="90" width="880" height="180" class="phase-band"/>
  <text x="60" y="118" class="phase-label">Phase 0 — Backlog</text>
  <text x="60" y="136" class="phase-num">.space/backlog/epic/&lt;bookname&gt;/</text>

  <!-- gist agent -->
  <rect x="80" y="150" width="200" height="90" class="box"/>
  <text x="180" y="178" text-anchor="middle" class="box-title">gist agent</text>
  <text x="180" y="198" text-anchor="middle" class="box-agent">.framework/agents/gist/</text>
  <text x="180" y="218" text-anchor="middle" class="box-output">→ epic.md, gist.md</text>

  <!-- init agent -->
  <rect x="360" y="150" width="200" height="90" class="box"/>
  <text x="460" y="178" text-anchor="middle" class="box-title">init agent</text>
  <text x="460" y="198" text-anchor="middle" class="box-agent">.framework/agents/init/</text>
  <text x="460" y="218" text-anchor="middle" class="box-output">→ book.json, override.md, masterprompt.txt</text>

  <!-- preset -->
  <rect x="640" y="150" width="240" height="90" class="box"/>
  <text x="760" y="178" text-anchor="middle" class="box-title">preset (filter chain)</text>
  <text x="760" y="198" text-anchor="middle" class="box-skill">layout skills (Preset section)</text>
  <text x="760" y="218" text-anchor="middle" class="box-output">layout-novel/SKILL.md / layout-poetry/SKILL.md</text>

  <line x1="280" y1="195" x2="360" y2="195" class="arrow" marker-end="url(#arrow)"/>
  <line x1="560" y1="195" x2="640" y2="195" class="arrow-muted" marker-end="url(#arrowMuted)"/>

  <!-- Phase 0 -> 1 -->
  <line x1="480" y1="270" x2="480" y2="310" class="arrow" marker-end="url(#arrow)"/>

  <!-- ===================== PHASE 1: SCAFFOLD ===================== -->
  <rect x="40" y="310" width="880" height="180" class="phase-band"/>
  <text x="60" y="338" class="phase-label">Phase 1 — Scaffold</text>
  <text x="60" y="356" class="phase-num">.space/pipeline/book_&lt;bookname&gt;/</text>

  <!-- scaffold agent -->
  <rect x="80" y="370" width="200" height="90" class="box"/>
  <text x="180" y="398" text-anchor="middle" class="box-title">scaffold agent</text>
  <text x="180" y="418" text-anchor="middle" class="box-agent">.framework/agents/scaffold/</text>
  <text x="180" y="438" text-anchor="middle" class="box-output">orchestrates layout</text>

  <!-- prelayout -->
  <rect x="360" y="370" width="200" height="90" class="box"/>
  <text x="460" y="398" text-anchor="middle" class="box-title">prelayout agent</text>
  <text x="460" y="418" text-anchor="middle" class="box-agent">.framework/agents/prelayout/</text>
  <text x="460" y="438" text-anchor="middle" class="box-output">resolve form, validate plan</text>

  <!-- layout skill -->
  <rect x="640" y="370" width="240" height="90" class="box"/>
  <text x="760" y="398" text-anchor="middle" class="box-title">layout skill</text>
  <text x="760" y="418" text-anchor="middle" class="box-skill">layout-novel / layout-poetry</text>
  <text x="760" y="438" text-anchor="middle" class="box-output">build pipeline structure</text>

  <line x1="280" y1="415" x2="360" y2="415" class="arrow" marker-end="url(#arrow)"/>
  <line x1="560" y1="415" x2="640" y2="415" class="arrow" marker-end="url(#arrow)"/>

  <!-- postlayout -->
  <rect x="360" y="470" width="200" height="0" class="box" opacity="0"/>
  <rect x="360" y="470" width="200" height="0" class="box" opacity="0"/>

  <!-- postlayout below -->
  <rect x="360" y="470" width="200" height="0" class="box" opacity="0"/>

  <!-- Phase 1 -> 2 -->
  <line x1="480" y1="490" x2="480" y2="530" class="arrow" marker-end="url(#arrow)"/>

  <!-- ===================== PHASE 2: FILTERS ===================== -->
  <rect x="40" y="530" width="880" height="300" class="phase-band"/>
  <text x="60" y="558" class="phase-label">Phase 2 — Filter Chain</text>
  <text x="60" y="576" class="phase-num">.space/pipeline/book_&lt;bookname&gt;/filters/</text>

  <!-- Novel chain label -->
  <text x="480" y="600" text-anchor="middle" class="box-sub">Novel (layout-novel/SKILL.md)</text>

  <!-- Novel filters: workshop research seeds correctness theme syntax -->
  <g>
    <rect x="60" y="615" width="120" height="56" class="filter-box"/>
    <text x="120" y="638" text-anchor="middle" class="filter-num">1</text>
    <text x="120" y="658" text-anchor="middle" class="filter-name">workshop</text>
  </g>
  <g>
    <rect x="200" y="615" width="120" height="56" class="filter-box"/>
    <text x="260" y="638" text-anchor="middle" class="filter-num">2</text>
    <text x="260" y="658" text-anchor="middle" class="filter-name">research</text>
  </g>
  <g>
    <rect x="340" y="615" width="120" height="56" class="filter-box"/>
    <text x="400" y="638" text-anchor="middle" class="filter-num">3</text>
    <text x="400" y="658" text-anchor="middle" class="filter-name">seeds</text>
  </g>
  <g>
    <rect x="480" y="615" width="120" height="56" class="filter-box"/>
    <text x="540" y="638" text-anchor="middle" class="filter-num">4</text>
    <text x="540" y="658" text-anchor="middle" class="filter-name">correctness</text>
  </g>
  <g>
    <rect x="620" y="615" width="120" height="56" class="filter-box"/>
    <text x="680" y="638" text-anchor="middle" class="filter-num">5</text>
    <text x="680" y="658" text-anchor="middle" class="filter-name">theme</text>
  </g>
  <g>
    <rect x="760" y="615" width="120" height="56" class="filter-box"/>
    <text x="820" y="638" text-anchor="middle" class="filter-num">6</text>
    <text x="820" y="658" text-anchor="middle" class="filter-name">syntax</text>
  </g>

  <line x1="180" y1="643" x2="200" y2="643" class="arrow" marker-end="url(#arrow)"/>
  <line x1="320" y1="643" x2="340" y2="643" class="arrow" marker-end="url(#arrow)"/>
  <line x1="460" y1="643" x2="480" y2="643" class="arrow" marker-end="url(#arrow)"/>
  <line x1="600" y1="643" x2="620" y2="643" class="arrow" marker-end="url(#arrow)"/>
  <line x1="740" y1="643" x2="760" y2="643" class="arrow" marker-end="url(#arrow)"/>

  <!-- Poetry chain label -->
  <text x="480" y="700" text-anchor="middle" class="box-sub">Poetry (layout-poetry/SKILL.md)</text>

  <!-- Poetry filters: workshop research correctness theme syntax override quality -->
  <g>
    <rect x="50" y="715" width="110" height="56" class="filter-box"/>
    <text x="105" y="738" text-anchor="middle" class="filter-num">1</text>
    <text x="105" y="758" text-anchor="middle" class="filter-name">workshop</text>
  </g>
  <g>
    <rect x="175" y="715" width="110" height="56" class="filter-box"/>
    <text x="230" y="738" text-anchor="middle" class="filter-num">2</text>
    <text x="230" y="758" text-anchor="middle" class="filter-name">research</text>
  </g>
  <g>
    <rect x="300" y="715" width="110" height="56" class="filter-box"/>
    <text x="355" y="738" text-anchor="middle" class="filter-num">3</text>
    <text x="355" y="758" text-anchor="middle" class="filter-name">correctness</text>
  </g>
  <g>
    <rect x="425" y="715" width="110" height="56" class="filter-box"/>
    <text x="480" y="738" text-anchor="middle" class="filter-num">4</text>
    <text x="480" y="758" text-anchor="middle" class="filter-name">theme</text>
  </g>
  <g>
    <rect x="550" y="715" width="110" height="56" class="filter-box"/>
    <text x="605" y="738" text-anchor="middle" class="filter-num">5</text>
    <text x="605" y="758" text-anchor="middle" class="filter-name">syntax</text>
  </g>
  <g>
    <rect x="675" y="715" width="110" height="56" class="filter-box"/>
    <text x="730" y="738" text-anchor="middle" class="filter-num">6</text>
    <text x="730" y="758" text-anchor="middle" class="filter-name">override</text>
  </g>
  <g>
    <rect x="800" y="715" width="110" height="56" class="filter-box"/>
    <text x="855" y="738" text-anchor="middle" class="filter-num">7</text>
    <text x="855" y="758" text-anchor="middle" class="filter-name">quality</text>
  </g>

  <line x1="160" y1="743" x2="175" y2="743" class="arrow" marker-end="url(#arrow)"/>
  <line x1="285" y1="743" x2="300" y2="743" class="arrow" marker-end="url(#arrow)"/>
  <line x1="410" y1="743" x2="425" y2="743" class="arrow" marker-end="url(#arrow)"/>
  <line x1="535" y1="743" x2="550" y2="743" class="arrow" marker-end="url(#arrow)"/>
  <line x1="660" y1="743" x2="675" y2="743" class="arrow" marker-end="url(#arrow)"/>
  <line x1="785" y1="743" x2="800" y2="743" class="arrow" marker-end="url(#arrow)"/>

  <!-- Phase 2 -> 3 -->
  <line x1="480" y1="830" x2="480" y2="870" class="arrow" marker-end="url(#arrow)"/>

  <!-- ===================== PHASE 3: WRITE ===================== -->
  <rect x="40" y="870" width="880" height="180" class="phase-band"/>
  <text x="60" y="898" class="phase-label">Phase 3 — Write</text>
  <text x="60" y="916" class="phase-num">source/books/book_&lt;bookname&gt;/chapters/</text>

  <!-- chapter agent -->
  <rect x="200" y="930" width="240" height="90" class="box"/>
  <text x="320" y="958" text-anchor="middle" class="box-title">chapter agent</text>
  <text x="320" y="978" text-anchor="middle" class="box-agent">.framework/agents/chapter/</text>
  <text x="320" y="998" text-anchor="middle" class="box-output">→ chapters/&lt;n&gt;.md (novel + poetry)</text>

  <!-- poet agent -->
  <rect x="520" y="930" width="240" height="90" class="box"/>
  <text x="640" y="958" text-anchor="middle" class="box-title">poet agent</text>
  <text x="640" y="978" text-anchor="middle" class="box-agent">.framework/agents/poet/</text>
  <text x="640" y="998" text-anchor="middle" class="box-output">→ single poem (poetry only)</text>

  <!-- Phase 3 -> 4 -->
  <line x1="480" y1="1050" x2="480" y2="1090" class="arrow" marker-end="url(#arrow)"/>

  <!-- ===================== PHASE 4: PROMOTE ===================== -->
  <rect x="40" y="1090" width="880" height="180" class="phase-band"/>
  <text x="60" y="1118" class="phase-label">Phase 4 — Quality &amp; Promote</text>
  <text x="60" y="1136" class="phase-num">source/books/book_&lt;bookname&gt;/book.md</text>

  <!-- quality agent -->
  <rect x="200" y="1150" width="240" height="90" class="box"/>
  <text x="320" y="1178" text-anchor="middle" class="box-title">quality agent</text>
  <text x="320" y="1198" text-anchor="middle" class="box-agent">.framework/agents/quality/</text>
  <text x="320" y="1218" text-anchor="middle" class="box-output">final gate &amp; audit</text>

  <!-- assemble -->
  <rect x="520" y="1150" width="240" height="90" class="box"/>
  <text x="640" y="1178" text-anchor="middle" class="box-title">assemble book.md</text>
  <text x="640" y="1198" text-anchor="middle" class="box-output">consolidate chapters</text>
  <text x="640" y="1218" text-anchor="middle" class="box-output">→ book.md</text>

  <line x1="440" y1="1195" x2="520" y2="1195" class="arrow" marker-end="url(#arrow)"/>

  <!-- ===================== LEGEND ===================== -->
  <rect x="40" y="1300" width="880" height="120" class="phase-band"/>
  <text x="60" y="1330" class="phase-label">Legend</text>

  <rect x="80" y="1350" width="16" height="16" class="box" rx="3"/>
  <text x="106" y="1363" class="legend-text">Agent (.framework/agents/)</text>

  <rect x="320" y="1350" width="16" height="16" class="box" rx="3" fill="#1e2230" stroke="#7fd1a8"/>
  <text x="346" y="1363" class="legend-text">Skill (.framework/skills/)</text>

  <rect x="560" y="1350" width="16" height="16" class="box" rx="3" fill="#1e2230" stroke="#e5c07b"/>
  <text x="586" y="1363" class="legend-text">Output artifact</text>

  <line x1="80" y1="1390" x2="130" y2="1390" class="arrow" marker-end="url(#arrow)"/>
  <text x="140" y="1394" class="legend-text">Flow direction</text>

  <!-- Footer -->
  <text x="480" y="1500" text-anchor="middle" class="subtitle">Agents invoke skills; the workflow never executes skills directly.</text>
  <text x="480" y="1522" text-anchor="middle" class="subtitle">Filter chain is preset-defined and flows: preset → init → book.json → scaffold → filters/filters.json</text>
</svg>
